
name: Python Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node for frontend tests
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install project and lint tool
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . "ruff==0.17.1"

      - name: Ruff
        run: python -m ruff check .

      # CUDA and native-tokenizer tests remain opt-in on equipped local machines.
      - name: Python unit tests
        run: python -m unittest discover -s tests -v

      - name: Frontend unit tests
        run: node --test tests/test_graph_frontend.js tests/test_cockpit_frontend.js
