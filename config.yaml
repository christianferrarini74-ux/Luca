storage:
  directory: D:/Test/Luca
  database: luca_v1.sqlite
  seed: seed/knowledge_base_v1.json

runtime:
  bible: bible.md
  user_identity: Christian
  language_adapter: gemma
  adapter_role: orchestrator
  vram_capacity: 5
  ram_capacity: 12
  memory_backend: cuda
  # CUDA ordinal 1 keeps Luca's node storage separate from the current LLM on GPU 0.
  gpu_device: 1
  memory_search_policy: fast
  memory_planner: llm
  synaptic:
    edge_upper: 50
    edge_target: 45
    navigation_steps: 8
    global_candidates: 20
    fast_index_bytes: 65536
    automatic_sleep: true
    idle_seconds: 60
    sleep_poll_seconds: 5
    sleep_retry_seconds: 300
    navigation_output_tokens: 8192
    maintenance_output_tokens: 8192
    interpretation_output_tokens: 1024
    recall_output_tokens: 1024
    search_query_characters: 2000
  # The current seed contains deliberate counterfactual experiments.
  memory_policy: experimental
  recent_window: 8
  vram_bytes: 8000000
  ram_bytes: 32000000
  context_budget:
    # All limits below are model tokens, not bytes or words.
    unit: tokens
    context_window: 70000
    output_reserve: 4096
    framing_reserve: 512
    memory_limit: 20000
    per_node_limit: 16000
    history_limit: 40000
    task_limit: 2048
  api:
    host: 127.0.0.1
    port: 8765

llm:
  active_runtime: local
  runtimes:
    local:
      providers:
        lm_studio:
          kind: openai_compatible
          base_url: http://127.0.0.1:1234/v1
          management_url: http://127.0.0.1:1234
      agents:
        orchestrator:
          provider: lm_studio
          model: google/gemma-4-e2b
          temperature: 0.0
          # Empty means provider defaults: Luca does not force thinking off.
          generation: {}
          # Long prompts need time for prefill as well as generation.
          timeout_seconds: 180

frontend:
  enabled: true
  # Display-only limits; these never restrict Luca's memory or navigation.
  graph:
    node_limit: 500
    edge_limit: 2000
