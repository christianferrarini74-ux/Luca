storage:
  directory: D:/Test/Luca
  database: luca_v1.sqlite
  seed: seed/knowledge_base_v1.json

runtime:
  language_adapter: gemma
  adapter_role: orchestrator
  vram_capacity: 5
  ram_capacity: 12
  memory_search_policy: fast
  memory_planner: hybrid
  # The current seed contains deliberate counterfactual experiments.
  memory_policy: experimental
  recent_window: 8
  vram_bytes: 8000000
  ram_bytes: 32000000
  context_budget:
    context_window: 8192
    output_reserve: 512
    framing_reserve: 256
    memory_limit: 4096
    per_node_limit: 1536
    history_limit: 1024
    task_limit: 512
  api:
    host: 127.0.0.1
    port: 8765

llm:
  active_runtime: local
  runtimes:
    local:
      providers:
        lm_studio:
          kind: openai_compatible
          base_url: http://127.0.0.1:1234/v1
          management_url: http://127.0.0.1:1234
      agents:
        orchestrator:
          provider: lm_studio
          model: google/gemma-4-e2b
          temperature: 0.0
          timeout_seconds: 30

frontend:
  enabled: true
  directory: gui
  api_url: http://127.0.0.1:8765
  url: http://localhost:3000
